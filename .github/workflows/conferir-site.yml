name: Conferir site no ar

on:
  push:
    branches: [main]
  schedule:
    - cron: "43 */6 * * *"
  workflow_dispatch:
    inputs:
      ambiente:
        description: "Ambiente a conferir"
        type: choice
        required: true
        default: producao
        options: [producao, desenvolvimento]
  pull_request:
    paths:
      - .github/workflows/conferir-site.yml
      - .github/scripts/conferir_site.py
      - .github/scripts/test_conferir_site.py

permissions:
  contents: read
  statuses: read

jobs:
  conferir:
    name: Site e API
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Testar o roteiro sem rede
        run: python3 -B -m unittest discover -s .github/scripts
      - name: Aguardar a publicação do commit na Vercel
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/conferir_site.py aguardar "$GITHUB_REPOSITORY" "$GITHUB_SHA"
      - name: Conferir as páginas e a API
        env:
          SITE: ${{ (github.event_name == 'pull_request' || inputs.ambiente == 'desenvolvimento') && 'https://dev.mandatometro.com.br' || 'https://mandatometro.com.br' }}
          API: ${{ (github.event_name == 'pull_request' || inputs.ambiente == 'desenvolvimento') && 'https://api-dev.mandatometro.com.br' || 'https://api.mandatometro.com.br' }}
        run: python3 .github/scripts/conferir_site.py conferir "$SITE" "$API"
