# Ambiente completo: banco, API e site. Suba com `docker compose up --build`.
# Os valores padrão batem com o .env.example; o .env, se existir, tem prioridade.
name: mandatometro

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mandatometro}
      POSTGRES_USER: ${POSTGRES_USER:-mandatometro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-troque-esta-senha}
    ports:
      # 5433 no computador, para não brigar com um PostgreSQL instalado nele na 5432.
      - "5433:5432"
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: apps/backend
    env_file:
      - path: .env
        required: false
    environment:
      # Dentro do Compose, o banco atende pelo nome do serviço, não por localhost.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mandatometro}:${POSTGRES_PASSWORD:-troque-esta-senha}@db:5432/${POSTGRES_DB:-mandatometro}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3001}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_URL: ${API_URL:-http://localhost:8000}
        APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3001}
    environment:
      API_URL: ${API_URL:-http://localhost:8000}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3001}
    ports:
      - "3001:3001"
    depends_on:
      - api
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db:
