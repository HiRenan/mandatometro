<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="utf-8" />
		<title>Ícone do Mandatômetro</title>
		<style>
			body {
				display: grid;
				place-items: center;
				height: 100vh;
				margin: 0;
				background: #14161c;
			}

			body > svg {
				display: block;
				width: 80vw;
				fill: #f6f1e4;
			}

			/* Na aba, arredondar a margem e abrir a dobra e os cortes até um pixel. */
			@media (width <= 32px) {
				body > svg {
					width: calc(100vw - 4px);
					stroke: #14161c;
					stroke-width: 18;
				}
			}

			@media (width: 16px) {
				body > svg {
					width: 13px;
					margin-left: 1px;
					stroke-width: 32;
				}
			}
		</style>
	</head>
	<body>
		<svg viewBox="0 0 700 610" aria-hidden="true">
			<defs><!-- MARCA --></defs>
			<use href="#paginas"></use>
		</svg>
	</body>
</html>
